<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web Scraper</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <style>
        body {
            background-color: #f8f9fa;
            font-family: Arial, sans-serif;
            padding: 20px;
        }
        .form-container {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            margin-bottom: 20px;
        }
        .table-container {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            text-align: center;
        }
        .table th, .table td {
            text-align: center;
            vertical-align: middle;
        }
        .table th {
            background-color: #007bff;
            color: white;
        }
        .table tbody tr:hover {
            background-color: #f1f1f1;
            cursor: pointer;
            transition: background 0.3s ease-in-out;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="form-container">
            <div class="row">
                <div class="col-md-6">
                    <form method="POST" action="/">
                        {% csrf_token %}
                        <input class="form-control" name="site" type="text" id="site" placeholder="Enter site address">
                </div>
                <div class="col-md-3">
                    <button class="btn btn-primary w-100" type="submit">Scrape</button>
                </div>
                <div class="col-md-3">
                    <a class="btn btn-warning w-100" href="/delete">Delete</a>
                </div>
                    </form>
            </div>
        </div>

        <div class="table-container">
            <div class="row">
                <div class="col-md-12">
                    <h2 class="text-center text-primary mb-3">Web Scraper Data</h2>
                    <table class="table table-hover">
                        <thead>
                            <tr>
                                <th scope="col">ID</th>
                                <th scope="col">Name</th>
                                <th scope="col">Link</th>
                            </tr>
                        </thead>
                        <tbody>
                            {% for link in data %}
                            <tr>
                                <td>{{ link.id }}</td>
                                <td>{{ link.name }}</td>
                                <td><a href="{{ link.address }}" target="_blank">Visit</a></td>
                            </tr>
                            {% endfor %}
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
